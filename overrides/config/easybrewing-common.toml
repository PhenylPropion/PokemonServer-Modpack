[General]
	#Max stack size of potion item.
	# Default: 16
	# Range: 1 ~ 64
	potionStackSize = 16
	#Amount of speed upgrade item can be used in one brewing station.
	# Default: 5
	# Range: 1 ~ 64
	maxSpeedUpgrade = 5
	#Allow brewing station to use amount upgrade item.
	allowAmountUpgrade = true
	#Amount of amount upgrade item can be used in one brewing station. Amount upgrade is for processing more item with one input item. For example, base recipe can craft 3 potion with 1 ingredient, consume 3 potion input produce 3 potion output. If amount upgrade is installed, if the upgrade add 1, it will become consume 4 and output 4.
	# Default: 1
	# Range: 1 ~ 64
	maxAmountUpgrade = 1

[ItemBrewingStation]
	#The amount of potion it can craft with one ingredient. Cannot be more than the potion stack size.
	# Default: 3
	# Range: 1 ~ 64
	potionCount = 3
	#The base processing time for a recipe in ticks
	# Default: 400
	# Range: 20 ~ 4000
	processingTime = 400

[Cobblemon]
	#The amount of cobblemon brewing recipe item can craft with one ingredient.
	# Default: 3
	# Range: 1 ~ 64
	cobblemonPotionCount = 3
